<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-light.png?v=20261112-5" data-theme-icon />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20261112-5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monica Addepalli</title>
    <meta
      name="description"
      content="Product Designer building and scaling impactful B2B and B2C experiences across healthcare and e-commerce."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link
      href="https://api.fontshare.com/v2/css?f[]=switzer@300,300i,400,500,500i,600,600i&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500&family=Gloria+Hallelujah&family=Inter:ital,wght@1,600&family=Manrope:wght@400;500;600;700;800&family=Recursive:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        function setFavicon(theme) {
          var link = document.querySelector('link[data-theme-icon]');
          if (!link) return;
          link.type = 'image/png';
          link.href = theme === 'light' ? '/favicon-dark.png?v=20261112-5' : '/favicon-light.png?v=20261112-5';
        }
        try {
          var t = localStorage.getItem('theme');
          var theme = t === 'light' || t === 'dark' ? t : 'light';
          document.documentElement.dataset.theme = theme;
          setFavicon(theme);
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
          setFavicon('light');
        }
      })();
    </script>
    <script src="https://superfolio.cv/embed/v1.js" defer></script>
  </head>
  <body>
    <script>
      (function () {
        try {
          var storageKey = 'portfolio-scroll-positions';
          var pathKey = location.pathname + location.search;
          if (location.hash) return;
          if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
          }
          var positions = JSON.parse(sessionStorage.getItem(storageKey) || '{}');
          var y = positions[pathKey];
          if (typeof y === 'number' && y > 0) {
            window.scrollTo(0, y);
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
